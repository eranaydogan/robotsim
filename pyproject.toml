[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "robotsim"
version = "0.1.0"
description = "C++ mobile robot navigation environment with a Gymnasium-compatible interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.3",
    "torch",
    "tensorboard",
    "matplotlib",
    "pillow",
]
dev = [
    "pytest>=8",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/robotsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"