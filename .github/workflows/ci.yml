name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Windows / MSVC / Python 3.12
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 cmake numpy gymnasium pytest matplotlib

      - name: Configure C++ tests and benchmarks
        run: cmake -S . -B build/tests -DBUILD_TESTING=ON -DROBOTSIM_BUILD_BENCHMARKS=ON -DROBOTSIM_WARNINGS_AS_ERRORS=ON

      - name: Build C++ tests and benchmarks
        run: cmake --build build/tests --config Release

      - name: Run C++ tests
        run: ctest --test-dir build/tests -C Release --output-on-failure

      # Timings on shared CI runners are not meaningful; this only checks that
      # the benchmark still builds and runs.
      - name: Benchmark smoke test
        run: build/tests/Release/robotsim_bench.exe --quick --reps 1

      # CMake definitions are passed through the environment instead of
      # -C arguments: PowerShell splits native arguments that start with '-'
      # and contain '.', which breaks pip's --config-settings parsing.
      - name: Build and install Python package
        env:
          SKBUILD_CMAKE_DEFINE: ROBOTSIM_WARNINGS_AS_ERRORS=ON
        run: python -m pip install . --no-build-isolation -v

      - name: Print build info
        run: python -c "import robotsim; print(robotsim.build_info())"

      - name: Run Python tests
        run: python -m pytest